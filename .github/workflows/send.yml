name: Send Douyin Messages

# 说明：本仓库在 GitHub Actions 上只做「巡检」（dry run，不发送消息）。
# 抖音会风控 GitHub 机房 IP，真实发送会失败并导致账号登录态失效，
# 因此真实发送由本机的 Windows 计划任务 DouyinStreakDaily（每天 08:30）执行。

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 的 cron 使用 UTC 时间，00:30 UTC = 08:30 北京时间
    - cron: "30 0 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/status.json"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write task config
        shell: bash
        run: printf '%s' "$DOUYIN_CONFIG" > config.json
      - name: Run (dry-run only)
        shell: bash
        run: |
          echo "巡检模式：不发送消息，仅验证登录态与好友是否可打开。"
          python run.py --dry-run
          echo "exit_code=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Publish run status
        if: always()
        shell: bash
        env:
          RUN_EXIT: ${{ env.exit_code }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os, pathlib
          st = {"exit_code": os.environ.get("RUN_EXIT", "none"), "event": os.environ.get("GITHUB_EVENT_NAME", "")}
          names = []
          p = pathlib.Path("config.json")
          if p.is_file():
              try:
                  c = json.loads(p.read_text(encoding="utf-8"))
                  names = [n for n in c.get("friends", []) if isinstance(n, str)]
                  for t in c.get("targets", []):
                      if isinstance(t, dict) and isinstance(t.get("name"), str):
                          names.append(t["name"])
              except Exception:
                  pass
          p = pathlib.Path("artifacts/result.json")
          if p.is_file():
              try:
                  r = json.loads(p.read_text(encoding="utf-8")).get("results", [])
                  st["total"] = len(r)
                  st["sent"] = sum(1 for x in r if x.get("sent"))
                  st["statuses"] = sorted({str(x.get("status")) for x in r})
              except Exception as e:
                  st["result_error"] = type(e).__name__
          else:
              st["result_error"] = "result.json missing"
          p = pathlib.Path("artifacts/run.log")
          if p.is_file():
              t = p.read_text(encoding="utf-8", errors="replace")
              for n in names:
                  t = t.replace(n, "<friend>")
              st["log_tail"] = t[-3000:]
          pathlib.Path("artifacts/status.json").write_text(json.dumps(st, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git config user.email "bot@users.noreply.github.com"
          git config user.name "douyin-bot"
          git add -f artifacts/status.json
          git commit -m "chore: publish run status" || echo "nothing to commit"
          git push || echo "push failed"
